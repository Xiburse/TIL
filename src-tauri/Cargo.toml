[package]
name = "til"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "til_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 把应用清单嵌进**所有**产物（含测试可执行文件）。见 build.rs 的说明
embed-resource = "3"

[dependencies]
# protocol-asset 是 asset:// 协议（即 convertFileSrc）的前提，见 tauri.conf.json 的 assetProtocol
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 读 src-tauri/til.toml（全局配置）。注意 Cargo.lock 里那个 toml 是 tauri-build
# 的 build-dependency，不算运行时依赖，必须在这里单独声明。
toml = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
