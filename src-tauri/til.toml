# ============================================================================
# til 桌面端的全局配置
#
# 这个文件回答一个问题：**Python 后端在哪、怎么启动它。**
# 图库本身的配置（library/inbox 路径、阈值、上限）不在这里，在 Python 侧的
# `<root>/config.toml` 里 —— 那份才是权威，改这个文件不会搬动图库。
# ============================================================================

[backend]

# Python 脚本根目录：`backend/` 包的父目录，也就是 spawn 时的 cwd。
#
# ⚠ 用**单引号**字面量。写成 "E:\Images" 会解析失败 —— TOML 里 \I 不是合法转义。
#
# ⚠ 这个值**只影响 cwd**，不影响 library/inbox 的实际位置。那些由
#   <root>/config.toml 决定（Python 侧把相对路径相对配置文件解析，不相对 CWD）。
#   所以改这里不会搬家，别指望它。
root = 'E:\Images'

# Python 解释器。可以填绝对路径 —— 用 venv 的话**应该**填绝对路径，
# 否则从桌面快捷方式启动时会用系统 Python，缺 onnxruntime。
python = 'python'

# 可选：Python 侧 config.toml 的路径，会以 `--config <路径>` 传给后端。
# 留空（或删掉这行）= 用 Python 默认的 <root>/config.toml。
# 装成应用后代码在 Program Files 不可写时，用这个指向用户目录下的配置。
#config = 'C:\Users\Xiburse\AppData\Roaming\imgshelf\config.toml'
